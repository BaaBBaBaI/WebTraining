<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Главная Супер сайта.</title>
    <meta name="description" content="Сайт Проекта">
    <link rel="icon" href="https://ir.ozone.ru/s3/multimedia-k/wc1000/6735084428.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<style>
    .my-image-container {
        height: 10vh;
        background: url("/assets/3840x2160-gray-web-gray-solid-color-background.jpg") top left no-repeat;
    }
</style>
<body>



<div class="container-fluid m-0 p-0">

    <div class="container-fluid text-center p-0">


        <div class="container-fluid p-0" style="max-height: 10vh;">
            <div class="my-image-container"></div>

        </div>


        <div class="container-fluid p-0 m-0">
            <nav class="row text-center g-1 row border border-2 m-0" aria-label="Main navigation">
                <a class="col-12 col-md d-block py-2 text-decoration-none text-black border-end border-3 m-0" href="#">Главная</a>
                <a class="col-12 col-md d-block py-2 text-decoration-none text-black border-end border-3 m-0" href="#">Новости</a>
                <a class="col-12 col-md d-block py-2 text-decoration-none text-black border-end border-3 m-0" href="#">Практика</a>
                <a class="col-12 col-md d-block py-2 text-decoration-none text-black border-end border-3 m-0" href="#">Товары</a>
                <a class="col-12 col-md d-block py-2 text-decoration-none text-black m-0" href="#">Контакты</a>
            </nav>
        </div>


    </div>

</div>


<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Информация об авторе</h2>

                    <div class="text-center mb-4">
                        <div class="bg-secondary rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 100px; height: 100px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="white" class="bi bi-person-fill" viewBox="0 0 16 16">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                            </svg>
                        </div>
                    </div>

                    <h5 class="text-center mb-2">Иванов Иван Иванович</h5>
                    <p class="text-center text-muted mb-4">ЭФБО-00-00</p>

                    <div class="mb-4">
                        <label class="form-label text-muted">Обо мне:</label>
                        <textarea class="form-control" rows="4" placeholder="Введите информацию о себе..."></textarea>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button class="btn btn-outline-secondary">Навык 1</button>
                            <button class="btn btn-outline-secondary">Навык 2</button>
                            <button class="btn btn-outline-secondary">Навык 3</button>
                            <button class="btn btn-outline-secondary">Навык 4</button>
                        </div>
                    </div>


                    <div>
                        <label class="form-label text-muted">Мой опыт:</label>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Опыт 1" readonly>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Опыт 2" readonly>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Опыт 3" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>

</html>
